name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    name: Validate GitHub automation
    uses: DevOpsDerek/workflows/.github/workflows/validate-agentic-workflows.yml@dac4b81c298cb3ea6821ea312efa5375f42d5ccb
    with:
      gh-aw-version: v0.89.21

  lint:
    name: Lint (PSScriptAnalyzer)
    uses: DevOpsDerek/workflows/.github/workflows/lint-powershell.yml@30f86d7d8536364b0a31de4bc66214b39e8785bb
    with:
      psscriptanalyzer-version: 1.24.0
      working-directory: .
      settings-path: PSScriptAnalyzerSettings.psd1

  test:
    name: Test (Pester)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0 -ErrorAction Stop

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path           = "$env:GITHUB_WORKSPACE/tests"
          $config.Output.Verbosity   = 'Detailed'
          $config.Run.Exit           = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath   = "$env:GITHUB_WORKSPACE/test-results.xml"
          $config.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pester-test-results
          path: test-results.xml
